<style>
:root{--bg:#07070a;--card:#111116;--card2:#17171f;--line:#262630;--ink:#f6f3ec;--mute:#a19ea9;--dim:#4d4b55;
  --gold:#f2c46d;--gold2:#d8962f;--green:#7ee08a;--green2:#2fae47;--red:#ff6b5e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{width:1600px;height:900px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;padding:54px 70px 64px;display:none;flex-direction:column;
  background:radial-gradient(900px 520px at 88% -12%,rgba(242,196,109,.13),transparent 60%),radial-gradient(700px 520px at -10% 112%,rgba(126,224,138,.07),transparent 60%),var(--bg)}
.slide.on{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-weight:800;letter-spacing:.16em;font-size:22px;color:var(--gold);text-transform:uppercase}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:72px;line-height:1.04;margin-top:6px}
.g{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gr{color:var(--green)}
.tile{width:96px;height:96px;border-radius:26px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.tile svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 1. що всередині */
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
.md{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 24px;display:flex;align-items:center;gap:18px}
.md .tile{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,#2a2a35,#16161d);border:1px solid #33323d}
.md .tile svg{width:40px;height:40px;stroke:var(--gold)}
.md b{display:block;font-size:17px;letter-spacing:.12em;color:var(--mute)}
.md span{display:block;font-size:27px;font-weight:800;line-height:1.15;margin-top:2px}
.plus{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:auto}
.pl{border-radius:24px;padding:24px 26px;background:linear-gradient(160deg,#1c1709,#111116);border:1px solid rgba(242,196,109,.35)}
.pl b{font-family:Oswald,sans-serif;font-size:76px;line-height:1;color:var(--gold);display:block}
.pl span{font-size:26px;font-weight:800;line-height:1.2}
.pl.inf{background:linear-gradient(160deg,#0f2214,#111116);border-color:rgba(126,224,138,.45)} .pl.inf b{color:var(--green)}

/* 2. назавжди */
.fv{display:grid;grid-template-columns:480px 1fr;gap:56px;flex:1;align-items:center}
.inf-big{font-family:Oswald,sans-serif;font-size:340px;line-height:.8;text-align:center;background:linear-gradient(180deg,#a7f3b4,#2fae47);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(47,174,71,.35))}
.inf-cap{text-align:center;font-family:Oswald,sans-serif;font-size:56px;margin-top:20px}
.fv ul{list-style:none;display:flex;flex-direction:column;gap:20px}
.fv li{display:flex;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 28px;font-size:31px;font-weight:800;line-height:1.2}
.fv li .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green2);display:flex;align-items:center;justify-content:center}
.fv li .ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fv .quote{margin-top:4px;font-size:30px;font-weight:700;color:var(--mute);padding-left:6px}

/* пакети — стек цінності */
.pk{display:grid;grid-template-columns:440px 1fr;gap:36px;flex:1;min-height:0}
.pk-l{display:flex;flex-direction:column}
.rib{display:inline-block;align-self:flex-start;font-weight:800;font-size:22px;letter-spacing:.1em;padding:8px 16px;border-radius:12px;color:#06210c;background:var(--green)}
.rib.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#2a1a02}
.rib.gray{background:#24242d;color:#d9d5cc}
.pk-l .nm{font-family:Oswald,sans-serif;font-weight:700;font-size:100px;white-space:nowrap;line-height:.95;margin-top:12px}
.pk-l .dur{align-self:flex-start;margin-top:18px;font-size:26px;font-weight:800;padding:10px 20px;border-radius:99px;background:#1d1d26;border:1px solid var(--line)}
.pk-l .for{font-size:26px;font-weight:700;line-height:1.3;margin-top:22px;color:#d9d5cc}
.tv{margin-top:auto;border-radius:26px;padding:24px 28px;background:linear-gradient(160deg,#1c1709,#111116);border:1px solid rgba(242,196,109,.45)}
.tv small{display:block;font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.tv b{font-family:Oswald,sans-serif;font-size:92px;line-height:1;display:block;margin-top:4px}
.tv .forever{margin-top:10px;font-size:23px;font-weight:800;color:var(--green)}
.list{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:10px 30px;display:flex;flex-direction:column;justify-content:space-between}
.it{display:flex;align-items:center;gap:18px;font-size:27px;font-weight:700;line-height:1.15;padding:6px 0;border-bottom:1px solid #1d1d25}
.it:last-child{border-bottom:0}
.it .ic{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.it .ic svg{width:22px;height:22px;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.it span{flex:1}
.it em{font-style:normal;font-family:Oswald,sans-serif;font-size:32px;font-weight:600;min-width:120px;text-align:right}
.it.y .ic{background:var(--green2)} .it.y .ic svg{stroke:#fff} .it.y em{color:var(--gold)}
.it.n{color:var(--dim)} .it.n span{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#5b2a2a}
.it.n .ic{background:#1d1d24;border:2px solid #2c2c35} .it.n .ic svg{stroke:#5a5862} .it.n em{color:#5a3434;text-decoration:line-through}
.it em.w{font-family:Manrope,sans-serif;font-size:21px;font-weight:800;letter-spacing:.06em}
.it.y em.w{color:var(--green)}
.pk.hand .list{border-color:rgba(126,224,138,.5);box-shadow:0 0 70px rgba(47,174,71,.15)}
.pk.vip .list{border-color:rgba(242,196,109,.5);box-shadow:0 0 70px rgba(242,196,109,.13)}
.c-base{color:#e8e4dc}.c-hand{color:var(--green)}.c-vip{color:var(--gold)}


/* пакети: пункти + бонуси (без цін) */
.list{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px 28px 20px;display:flex;flex-direction:column}
.sec{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--mute);margin:4px 0 6px}
.sec.b{margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:var(--gold)}
.sec.b i{font-style:normal;font-family:Oswald,sans-serif;font-size:30px;letter-spacing:0;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.chip{display:flex;align-items:center;gap:9px;border-radius:14px;padding:9px 10px;font-size:19px;font-weight:800;line-height:1.1;background:#1b1a14;border:1px solid rgba(242,196,109,.35)}
.chip .dot{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.chip .dot svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.off{background:transparent;border:1px dashed #2c2c35;color:#45434c;text-decoration:line-through;text-decoration-color:#5b2a2a;text-decoration-thickness:2px}
.chip.off .dot{background:#1d1d24!important} .chip.off .dot svg{stroke:#45434c}
.meter{margin-top:auto;border-radius:26px;padding:22px 26px;background:linear-gradient(160deg,#1c1709,#111116);border:1px solid rgba(242,196,109,.45)}
.meter .mt{display:flex;justify-content:space-between;align-items:baseline;font-size:24px;font-weight:800;color:var(--gold)}
.meter .mt b{font-family:Oswald,sans-serif;font-size:58px;color:var(--ink)}
.meter .bar{height:14px;border-radius:99px;background:#24242d;margin-top:10px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.meter .forever{margin-top:12px;font-size:23px;font-weight:800;color:var(--green)}
/* теги пакетів на бонусах */
.tags{display:flex;gap:6px;margin-top:10px;position:relative}
.tags span{font-size:15px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:8px;background:#1f1f27;color:#4d4b55}
.tags span.on.base{background:#e8e4dc;color:#111}.tags span.on.hand{background:var(--green);color:#06210c}.tags span.on.vip{background:var(--gold);color:#2a1a02}
.bn.tot .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;margin-top:14px}
.bn.tot .grid3 div{border-radius:16px;background:rgba(0,0,0,.35);padding:12px 8px}
.bn.tot .grid3 small{display:block;font-size:19px;font-weight:800;letter-spacing:.08em}
.bn.tot .grid3 s{font-family:Oswald,sans-serif;font-size:44px;color:#8d8a94;text-decoration-color:var(--red);text-decoration-thickness:4px}
.bn.tot .grid3 b{display:block;font-family:Oswald,sans-serif;font-size:50px;color:var(--green);line-height:1}


.pl.bl b{filter:blur(14px);transition:filter .5s;cursor:pointer;user-select:none}
.pl.bl.show b{filter:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(8,auto);grid-auto-flow:column;column-gap:28px}
.grid2 .it{font-size:24px;padding:6px 0;gap:14px;white-space:nowrap}
.grid2 .it .ic{width:34px;height:34px}
.grid2 .it .ic svg{width:20px;height:20px}
.grid2 .it:nth-child(8),.grid2 .it:nth-child(16){border-bottom:0}
.sweet{margin-top:18px;border-radius:18px;padding:14px 18px;background:rgba(126,224,138,.1);border:1px solid rgba(126,224,138,.45);font-size:24px;font-weight:800;line-height:1.25;color:#d7f5dc}
.sweet b{color:var(--green);font-family:Oswald,sans-serif;font-size:30px}
.meter .mt{font-size:21px} .meter .mt b{font-size:44px}

/* бонуси */
.bg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:24px;flex:1;margin-top:28px;min-height:0}
.bn{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:28px;padding:22px 26px;display:flex;flex-direction:column;overflow:hidden}
.bn .glow{position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;filter:blur(50px);opacity:.28}
.bn .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.val{text-align:right}
.val small{display:block;font-size:17px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.val b{font-family:Oswald,sans-serif;font-size:58px;line-height:1;color:var(--gold)}
.bn .num{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--mute);margin-top:auto;position:relative}
.bn .t{font-size:30px;font-weight:800;line-height:1.12;margin-top:6px;position:relative}
.bn .d{font-size:21px;font-weight:600;color:var(--mute);margin-top:6px;position:relative}
.bn.tot{background:linear-gradient(150deg,#2a1f08,#121014);border-color:rgba(242,196,109,.6);align-items:center;justify-content:center;text-align:center}
.bn.tot .l1{font-size:26px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.bn.tot .row{display:flex;align-items:center;gap:36px}
.bn.tot .old{font-family:Oswald,sans-serif;font-size:72px;color:#8d8a94;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:5px}
.bn.tot .zero{font-family:Oswald,sans-serif;font-size:130px;line-height:1;color:var(--green)}
.bn.tot .l2{font-size:26px;font-weight:700;color:#e9e4d8}

/* ціни */
.pr{display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:28px;flex:1;margin-top:34px;min-height:0}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:28px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pc.hit{border:3px solid var(--green2);background:linear-gradient(180deg,#0f1d13,var(--card));box-shadow:0 0 90px rgba(47,174,71,.2)}
.pc.vip{border-color:rgba(242,196,109,.55)}
.pc .rib{position:absolute;top:-22px;align-self:center}
.pc .nm{font-family:Oswald,sans-serif;font-size:54px;font-weight:700;line-height:1}
.pc .rows{width:100%;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.pc .r{display:flex;justify-content:space-between;align-items:baseline;font-size:23px;font-weight:800;color:var(--mute);border-bottom:1px dashed #2c2b34;padding-bottom:6px}
.pc .r.win{color:var(--green)} .pc .r.win b{font-family:Oswald,sans-serif;font-size:40px}
.pc .r s{font-family:Oswald,sans-serif;font-size:40px;color:#8a8792;text-decoration-color:var(--red);text-decoration-thickness:4px}
.pc .lb{font-size:21px;font-weight:800;letter-spacing:.12em;color:var(--mute);margin-top:12px}
.pc .now{font-family:Oswald,sans-serif;font-size:128px;line-height:1}
.pc .parts{font-size:30px;font-weight:800;color:#e9e4d8;min-height:40px}
.pc .day{margin-top:auto;width:100%;border-radius:18px;padding:14px;background:#17171f;font-size:25px;font-weight:800}
.pc .day b{color:var(--gold)}
.note{margin-top:22px;text-align:center;font-size:30px;font-weight:800;color:#ffb4ab}

/* умови / старт */
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1;margin-top:36px;min-height:0}
.tc{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:44px 38px;display:flex;flex-direction:column}
.tc .tile{width:110px;height:110px;border-radius:30px}
.tc .tile svg{width:62px;height:62px}
.tc h3{font-size:46px;font-weight:800;line-height:1.1;margin-top:30px}
.tc p{font-size:33px;font-weight:600;line-height:1.35;color:#c9c5bd;margin-top:16px}
.tc.hot{border-color:rgba(255,107,94,.55);background:linear-gradient(160deg,#241210,var(--card))}
.tc .n{font-family:Oswald,sans-serif;font-size:110px;line-height:1;color:var(--gold)}
.final{margin-top:30px;text-align:center;font-family:Oswald,sans-serif;font-size:54px;font-weight:600}

/* навігація */
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:5;opacity:.55;transition:opacity .2s}
.nav:hover{opacity:1}
.nav button{background:#15151b;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.dots{display:flex;gap:7px}
.dots span{width:8px;height:8px;border-radius:50%;background:#33323b;cursor:pointer}
.dots span.on{background:var(--gold);width:24px;border-radius:99px}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav"><button id="prev" aria-label="Назад">←</button><div class="dots" id="dots"></div><button id="next" aria-label="Далі">→</button></div>

<script>
(function(){
  var P=window.P, deck=document.getElementById('deck');
  var fm=function(n){return '$'+n.toLocaleString('en-US').replace(/,/g,' ')};
  var I={
    ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', no:'<path d="M7 7l10 10M17 7L7 17"/>',
    ads:'<path d="M3 10.5v3a1 1 0 0 0 1 1h2.5L12 19V5L6.5 9.5H4a1 1 0 0 0-1 1z"/><path d="M15.5 9a3.5 3.5 0 0 1 0 6"/><path d="M18.5 6a7.5 7.5 0 0 1 0 12"/>',
    cam:'<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/>',
    ai:'<path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>',
    book:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/><path d="M8.5 7.5h7M8.5 11h5"/>',
    tpl:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/>',
    chat:'<path d="M4 5h16v11H10l-6 4.5z"/><path d="M8 9h8M8 12.5h5"/>',
    clap:'<rect x="3" y="9.5" width="18" height="11" rx="2"/><path d="M3 9.5l1.6-4.5h14.8L21 9.5M8.5 5l-1.6 4.5M13.5 5l-1.6 4.5M18.5 5l-1.6 4.5"/>',
    bolt:'<path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z"/>',
    warn:'<path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v4.5M12 17.6v.2"/>',
    check:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M7.5 8.5l1.6 1.6L12 7.2M7.5 14.5l1.6 1.6L12 13.2M14.5 9h2.5M14.5 15h2.5"/>',
    card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
    shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    clock:'<path d="M7 3h10M7 21h10M8 3v3.5a4 4 0 0 0 1.6 3.2L12 11.5l2.4-1.8A4 4 0 0 0 16 6.5V3M8 21v-3.5a4 4 0 0 1 1.6-3.2l2.4-1.8 2.4 1.8a4 4 0 0 1 1.6 3.2V21"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/>',
    cut:'<circle cx="6" cy="6.5" r="2.8"/><circle cx="6" cy="17.5" r="2.8"/><path d="M8.3 8l11.7 10M8.3 16L20 6"/>',
    send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
    trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    cash:'<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.01M18 14.5v.01"/>'
  };
  var svg=function(k){return '<svg viewBox="0 0 24 24">'+I[k]+'</svg>'};
  var tile=function(k,c){return '<div class="tile" style="background:linear-gradient(145deg,'+c[0]+','+c[1]+')">'+svg(k)+'</div>'};
  var bonusSum=P.bonuses.reduce(function(s,b){return s+b.v},0);
  var cls=['base','hand','vip'];
  function inPack(b,k){return k>=b.tier}
  function bonusVal(k){return P.bonuses.reduce(function(s,b){return s+(inPack(b,k)?b.v:0)},0)}
  function bonusCnt(k){return P.bonuses.filter(function(b){return inPack(b,k)}).length}
  function packValue(k){return P.coreVal[k]+bonusVal(k)}
  var html='';

  /* 2. Доступ назавжди */
  var ok='<div class="ic"><svg viewBox="0 0 24 24">'+I.ok+'</svg></div>';
  html+='<section class="slide"><div class="kicker">Важливо</div><h1>Твоє — <span class="gr">назавжди</span></h1><div class="fv">'+
    '<div><div class="inf-big">∞</div><div class="inf-cap">Довічний доступ</div></div><ul>'+
    '<li>'+ok+'Наставництво закінчується — доступ залишається</li>'+
    '<li>'+ok+'Будь-який урок переглядаєш, коли потрібно</li>'+
    '<li>'+ok+'Усі бонуси й матеріали — твої назавжди</li>'+
    '<li>'+ok+'Нова послуга чи ніша — повертаєшся до системи</li>'+
    '<div class="quote">Платиш один раз — користуєшся роками.</div></ul></div></section>';

  /* 3–5. Пакети: що входить + бонуси (без цін) */
  var coreN=function(k){return P.core.filter(function(r){return r[k+1]}).length};
  var totalOpt=P.core.length+P.bonuses.length;
  P.packs.forEach(function(p,k){
    var rows=P.core.map(function(r){var c=r[k+1];
      return '<div class="it '+(c?'y':'n')+'"><div class="ic">'+svg(c?'ok':'no')+'</div><span>'+(typeof c==='string'?c:r[0])+'</span></div>'}).join('');
    var chips=P.bonuses.map(function(b){var on=inPack(b,k);
      return '<div class="chip'+(on?'':' off')+'"><div class="dot" style="background:linear-gradient(145deg,'+b.c[0]+','+b.c[1]+')">'+svg(b.ic)+'</div>'+b.s+'</div>'}).join('');
    var n=bonusCnt(k), all=n===P.bonuses.length, cn=coreN(k);
    var pct=Math.round((cn+n)/totalOpt*100);
    var rib=p.hit?'<div class="rib">ХІТ ПРОДАЖІВ 🔥</div>':(p.key==='vip'?'<div class="rib gold">МАКСИМУМ</div>':'<div class="rib gray">СТАРТ</div>');
    var gold=p.hit?'<div class="sweet">⭐ Золота середина: <b>'+pct+'%</b> усього, що є у VIP</div>':'';
    html+='<section class="slide"><div class="pk '+cls[k]+'"><div class="pk-l">'+rib+
      '<div class="nm c-'+cls[k]+'">'+p.name+'</div><div class="dur">'+p.dur+'</div><div class="for">'+p.for+'</div>'+gold+
      '<div class="meter"><div class="mt">✅ МОЖЛИВОСТІ <b>'+cn+' / '+P.core.length+'</b></div><div class="bar"><i style="width:'+(cn/P.core.length*100)+'%"></i></div>'+
      '<div class="mt" style="margin-top:14px">🎁 БОНУСИ <b>'+n+' / '+P.bonuses.length+'</b></div><div class="bar"><i style="width:'+(n/P.bonuses.length*100)+'%"></i></div></div>'+
      '</div><div class="list"><div class="sec">ЩО ВХОДИТЬ</div><div class="grid2">'+rows+'</div>'+
      '<div class="sec b">🎁 '+(all?'УСІ БОНУСИ VIP — БЕЗ ВИНЯТКІВ':(k===0?'+ СТАРТОВІ БОНУСИ':'+ РОЗШИРЕНІ БОНУСИ'))+'<i>'+n+'</i></div><div class="chips">'+chips+'</div></div></div></section>';
  });

  /* 6–7. Бонуси: кожен з цінністю і пакетами */
  var tagN=['БАЗА','ЗА РУКУ','VIP'];
  function bcard(b,n){return '<div class="bn"><div class="glow" style="background:'+b.c[0]+'"></div><div class="top">'+tile(b.ic,b.c)+
    '<div class="val"><small>ЦІННІСТЬ</small><b>'+fm(b.v)+'</b></div></div><div class="num">БОНУС '+n+'</div><div class="t">'+b.t+'</div><div class="d">'+b.d+'</div>'+
    '<div class="tags">'+tagN.map(function(t,k){return '<span class="'+cls[k]+(inPack(b,k)?' on':'')+'">'+t+'</span>'}).join('')+'</div></div>'}
  html+='<section class="slide"><div class="kicker">Бонуси · у кожному пакеті</div><h1>Інструменти, що <span class="g">роблять роботу за тебе</span></h1><div class="bg">'+
    P.bonuses.slice(0,6).map(function(b,i){return bcard(b,i+1)}).join('')+'</div></section>';
  html+='<section class="slide"><div class="kicker">Бонуси · «За руку» і VIP</div><h1>Більший пакет — <span class="g">більше інструментів</span></h1><div class="bg">'+
    P.bonuses.slice(6).map(function(b,i){return bcard(b,i+7)}).join('')+
    '<div class="bn tot"><div class="l1">БОНУСИ У ПОДАРУНОК</div><div class="grid3">'+
    P.packs.map(function(p,k){return '<div><small class="c-'+cls[k]+'">'+p.name+'</small><s>'+fm(bonusVal(k))+'</s><b>$0</b></div>'}).join('')+
    '</div></div></div></section>';

  /* 8. Ціни */
  html+='<section class="slide"><div class="kicker">Вартість</div><h1>Скільки це коштує <span class="g">для тебе</span></h1><div class="pr">'+
    P.packs.map(function(p,k){return '<div class="pc '+(p.hit?'hit':'')+(p.key==='vip'?' vip':'')+'">'+(p.hit?'<div class="rib">ХІТ ПРОДАЖІВ</div>':'')+
      '<div class="nm c-'+cls[k]+'">'+p.name+'</div><div class="rows">'+
      '<div class="r">Цінність <s>'+fm(packValue(k))+'</s></div><div class="r">Звичайна ціна <s>'+fm(p.old)+'</s></div><div class="r win">Твоя вигода <b>'+fm(packValue(k)-p.now)+'</b></div></div>'+
      '<div class="lb">ДЛЯ ТЕБЕ СЬОГОДНІ</div><div class="now c-'+cls[k]+'">'+fm(p.now)+'</div>'+
      '<div class="parts">'+(p.parts?'або '+p.parts:'&nbsp;')+'</div>'+
      '<div class="day">≈ <b>$'+Math.round(p.now/p.days)+' на день</b> · доступ назавжди</div></div>'}).join('')+
    '</div><div class="note">⏳ Ціна діє до кінця консультації</div></section>';

  deck.innerHTML=html;
  [].forEach.call(deck.querySelectorAll('.pl.bl'),function(e){e.onclick=function(){e.classList.toggle('show')}});

  var sl=[].slice.call(deck.querySelectorAll('.slide')), i=0, dots=document.getElementById('dots');
  sl.forEach(function(_,k){var d=document.createElement('span');d.onclick=function(){go(k)};dots.appendChild(d)});
  function go(n){i=Math.max(0,Math.min(sl.length-1,n));sl.forEach(function(s,k){s.classList.toggle('on',k===i)});
    [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===i)});
    try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
  document.addEventListener('keydown',function(e){
    if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key)>-1){e.preventDefault();go(i+1)}
    if(['ArrowLeft','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();go(i-1)}
    if(e.key==='Home')go(0); if(e.key==='End')go(sl.length-1)});
  document.getElementById('next').onclick=function(){go(i+1)}; document.getElementById('prev').onclick=function(){go(i-1)};
  var sx=null; document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));sx=null});
  function fit(){var s=Math.min(innerWidth/1600,innerHeight/900);deck.style.transform='scale('+s+')'}
  addEventListener('resize',fit); fit();
  go((parseInt(location.hash.slice(1))||1)-1);
})();
</script>
</body>
</html>
