<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комерційна пропозиція</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #track {
    display: flex;
    width: 400%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .slide {
    width: 100vw;
    height: 100vh;
    flex: 0 0 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div id="track">
    <div class="slide"><img src="1.PNG" alt="Слайд 1"></div>
    <div class="slide"><img src="2.PNG" alt="Слайд 2"></div>
    <div class="slide"><img src="3.PNG" alt="Слайд 3"></div>
    <div class="slide"><img src="4.PNG" alt="Слайд 4"></div>
  </div>

<script>
  const track = document.getElementById('track');
  const total = 4;
  let index = 0;

  function render() {
    track.style.transform = `translateX(-${index * 100}vw)`;
  }

  function go(dir) {
    index = Math.min(total - 1, Math.max(0, index + dir));
    render();
  }

  // Клавіші ← →  (а також ↑ ↓, PageUp/PageDown, пробіл, Home/End)
  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case ' ':
        e.preventDefault(); go(1); break;
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
        e.preventDefault(); go(-1); break;
      case 'Home':
        e.preventDefault(); index = 0; render(); break;
      case 'End':
        e.preventDefault(); index = total - 1; render(); break;
    }
  });

  // Колесо миші / трекпад
  let wheelLock = false;
  window.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(delta) < 10) return;
    wheelLock = true;
    go(delta > 0 ? 1 : -1);
    setTimeout(() => { wheelLock = false; }, 600);
  }, { passive: true });

  // Свайп (тач)
  let startX = 0, startY = 0;
  window.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      go(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  render();
</script>
</body>
</html>
